name: Iterate
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget: {iOS: "17.0", watchOS: "10.0"}
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  CarPlay: release
  JapanVoice: release
configFiles:
  Debug: Configuration/Deployment.xcconfig
  Release: Configuration/Deployment.xcconfig
  CarPlay: Configuration/Deployment.xcconfig
  JapanVoice: Configuration/Deployment.xcconfig
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 10
    MARKETING_VERSION: "1.2"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targetTemplates:
  Extension:
    sources: [Configuration/Deployment.swift]
    type: app-extension
    platform: iOS
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/Group.entitlements
  AssistantService:
    sources:
      - Shared
      - Sources/CredentialStore.swift
      - Sources/IterateClient.swift
      - Sources/MindSocket.swift
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Configuration/MemberExtension.entitlements
targets:
  Iterate:
    type: application
    platform: iOS
    sources:
      - Configuration/Deployment.swift
      - Sources
      - Shared
      - Native
      - Intents
      - Capture/App
      - Capture/CameraUI
      - Capture/Shared
      - Companions
      - Extensions/Watch/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID)
        INFOPLIST_FILE: Configuration/App.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Iterate.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
      configs:
        CarPlay: {CODE_SIGN_ENTITLEMENTS: Configuration/CarPlay.entitlements}
        JapanVoice: {CODE_SIGN_ENTITLEMENTS: Configuration/JapanVoice.entitlements}
    dependencies:
      - target: IterateWidgets
      - target: IterateShare
      - target: IterateCameraCapture
      - target: IterateSafari
      - target: IterateKeyboard
      - target: IterateWatch
  IterateWidgets:
    templates: [Extension, AssistantService]
    sources:
      - {path: Extensions/Widgets, excludes: [Info.plist]}
      - Native/Agents/IterateAgent.swift
      - Native/Agents/RecentAgentsSnapshot.swift
      - Native/Agents/RecentAgentsTimeline.swift
      - Intents/NavigationIntents.swift
      - Intents/Alarms.swift
      - Capture/CameraControl
      - Capture/Shared/IterateCameraIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).widgets
        INFOPLIST_FILE: Extensions/Widgets/Info.plist
  IterateShare:
    templates: [Extension, AssistantService]
    sources:
      - {path: Extensions/Share, excludes: [Info.plist]}
      - Capture/Shared/CaptureInbox.swift
      - Capture/Shared/CaptureReview.swift
      - Capture/Shared/IterateAnswerView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).share
        INFOPLIST_FILE: Extensions/Share/Info.plist
  IterateCameraCapture:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Configuration/Deployment.swift
      - {path: Extensions/Camera, excludes: [Info.plist]}
      - Capture/CameraUI
      - Capture/Shared/IterateCameraIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).camera
        INFOPLIST_FILE: Extensions/Camera/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  IterateSafari:
    templates: [Extension, AssistantService]
    sources:
      - {path: Extensions/Safari, excludes: [Info.plist]}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).safari
        INFOPLIST_FILE: Extensions/Safari/Info.plist
  IterateKeyboard:
    templates: [Extension, AssistantService]
    sources:
      - {path: Extensions/Keyboard, excludes: [Info.plist]}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).keyboard
        INFOPLIST_FILE: Extensions/Keyboard/Info.plist
  IterateWatch:
    type: application
    platform: watchOS
    sources:
      - Configuration/Deployment.swift
      - {path: Extensions/Watch/App, excludes: [Info.plist]}
      - Extensions/Watch/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).watch
        INFOPLIST_FILE: Extensions/Watch/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Group.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    dependencies:
      - target: IterateWatchWidgets
  IterateWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Configuration/Deployment.swift
      - {path: Extensions/Watch/Widgets, excludes: [Info.plist]}
      - Extensions/Watch/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).watch.widgets
        INFOPLIST_FILE: Extensions/Watch/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Group.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  IterateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Capture/Tests]
    dependencies: [{target: Iterate}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Iterate:
    build:
      targets: {Iterate: all}
    test:
      targets: [IterateTests]
  Iterate CarPlay:
    build: {targets: {Iterate: all}}
    run: {config: CarPlay}
    archive: {config: CarPlay}
  Iterate Japan Voice:
    build: {targets: {Iterate: all}}
    run: {config: JapanVoice}
    archive: {config: JapanVoice}
