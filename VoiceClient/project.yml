name: IterateVoice
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: ../Configuration/Deployment.xcconfig
  Release: ../Configuration/Deployment.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: 4
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  Iterate:
    type: application
    platform: iOS
    sources:
      - VoiceApp.swift
      - ../Configuration/Deployment.swift
      - ../Sources/Assets.xcassets
      - ../Sources/CallAudio.swift
      - ../Native/IterateMotion.swift
      - ../Sources/ConnectionScreen.swift
      - ../Sources/CredentialStore.swift
      - ../Sources/IterateClient.swift
      - ../Sources/LiveVoice.swift
      - ../Sources/MindConnection.swift
      - ../Sources/MindSocket.swift
      - ../Sources/VoiceRelay.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).voice
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ITERATE_VOICE_ONLY"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Iterate
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Iterate uses your microphone when you start a live voice conversation with your Iterate mind.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  IterateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/ConnectionTests.swift
      - ../Tests/VoiceTests.swift
      - ../Tests/Greeting.m4a
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITERATE_BUNDLE_ID).voice.tests
    dependencies:
      - target: Iterate
schemes:
  Iterate:
    build:
      targets:
        Iterate: all
    test:
      targets:
        - IterateTests
